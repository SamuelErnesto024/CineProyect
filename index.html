<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineProyect</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace; 
        }
        
        body {
            background-color: #05000a;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden; 
        }

        header { 
            text-align: center; 
            margin-bottom: 50px; 
        }
        /* ========================
           Menú de Navegación
           ======================== */
        .menu-navegacion {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .menu-navegacion a {
            color: #fff;
            text-decoration: none; /* Quita la línea de abajo típica de los links */
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .menu-navegacion a:hover {
            border-color: #d100d1; /* En coming-soon.html puedes cambiar esto a #00ffff */
            color: #d100d1;        /* En coming-soon.html puedes cambiar esto a #00ffff */
            box-shadow: 0 0 15px rgba(209, 0, 209, 0.4);
            transform: translateY(-3px);
        }

        h1 { 
            font-size: 3.5rem; 
            color: #d100d1;
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            letter-spacing: -2px;
            transform: rotate(-2deg); 
        }

        .catalog {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        @keyframes entraCard {
            0% { opacity: 0; transform: translateY(50px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card {
            background: linear-gradient(180deg, #1a0033 0%, #05000a 100%);
            border: 2px solid #330066;
            border-radius: 15px;
            width: 280px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: entraCard 0.6s ease-out backwards;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.03);
            border-color: #ff00ff;
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.4);
        }

        .poster {
            width: 100%;
            height: 380px;
            border-radius: 10px;
            margin-bottom: 15px;
            object-fit: cover;
            background-color: #111;
        }

        .card h3 { 
            margin: 10px 0; 
            color: #fff;
            font-size: 1.4rem;
        }

        .btn-comprar {
            background-color: transparent;
            border: 2px solid #8e2de2;
            color: #8e2de2;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-comprar:hover { 
            background-color: #8e2de2;
            color: #fff;
            box-shadow: 0 0 10px #8e2de2;
        }

        .overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .panel {
            background: linear-gradient(135deg, #2a0845 0%, #000000 100%);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ff00ff;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 40px rgba(209, 0, 209, 0.7);
            animation: bounceIn 0.5s ease-out;
        }

        .panel h2 { text-align: center; color: #ff00ff; margin-bottom: 5px; }
        .panel h3 { text-align: center; color: #fff; margin-bottom: 25px; }

        .campo { margin-bottom: 20px; }
        .panel label { display: block; margin-bottom: 8px; color: #d100d1; font-weight: bold;}

        .panel select, .panel input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ff00ff;
            background: #111;
            color: #fff;
            font-family: inherit;
        }

        .panel-botones {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-accion {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .btn-cancelar { background-color: #444; color: #fff; }
        .btn-confirmar { background-color: #d100d1; color: #fff; }
        .btn-confirmar:hover { background-color: #ff00ff; box-shadow: 0 0 10px #ff00ff;}

    </style>
</head>
<body>

    <header>
        <h1>CINE·PROYECT</h1>
        <nav class="menu-navegacion">
        <a href="index.html">Cartelera Actual</a>
        <a href="coming-soon.html">Próximamente</a>
    </nav>
    </header>

    <div class="catalog">
        
        <div class="card" style="animation-delay: 0.1s">
            <img class="poster" src="laodisea.jpg" alt="Poster 1">
            <h3>La Odisea</h3>
            <button class="btn-comprar" onclick="abrirRegistro('La Odisea')">Tickets</button>
        </div>

        <div class="card" style="animation-delay: 0.3s">
            <img class="poster" src="michael.jpg" alt="Poster 2">
            <h3>Michael Jackson</h3>
            <button class="btn-comprar" onclick="abrirRegistro('Michael Jackson')">Tickets</button>
        </div>

        <div class="card" style="animation-delay: 0.5s">
            <img class="poster" src="scarymovie.jpg" alt="Poster 3">
            <h3>Scary Movie</h3>
            <button class="btn-comprar" onclick="abrirRegistro('Scary Movie')">Tickets</button>
        </div>

        <div class="card" style="animation-delay: 0.7s">
            <img class="poster" src="tpta.jpg" alt="Poster 4">
            <h3>De Tal Palo Tal Astilla</h3>
            <button class="btn-comprar" onclick="abrirRegistro('De Tal Palo Tal Astilla')">Tickets</button>
        </div>

    </div>

    <div class="overlay" id="panelTicket">
        <div class="panel">
            <h2>RESERVA</h2>
            <h3 id="peliSeleccionada">Nombre Película</h3>
            
            <div class="campo">
                <label>Horarios disponibles (Hoy):</label>
                <select id="horarioPeli">
                    <option value="15:30">Sala 1 - 3:30 PM (Apertura)</option>
                    <option value="17:45">Sala 3 - 5:45 PM</option>
                    <option value="20:00">Sala 1 - 8:00 PM</option>
                    <option value="22:15">Sala 2 - 10:15 PM</option>
                </select>
            </div>

            <div class="campo">
                <label>Tus Tickets:</label>
                <input type="number" id="cantidadTickets" min="1" max="5" value="1">
            </div>

            <div class="panel-botones">
                <button class="btn-accion btn-cancelar" onclick="cerrarRegistro()">VOLVER</button>
                <button class="btn-accion btn-confirmar" onclick="confirmarReserva()">¡CONFIRMAR!</button>
            </div>
        </div>
    </div>

    <script>
        let peliElegida = "";

        function abrirRegistro(nombrePeli) {
            peliElegida = nombrePeli;
            document.getElementById("peliSeleccionada").innerText = peliElegida;
            document.getElementById("panelTicket").style.display = "flex";
        }

        function cerrarRegistro() {
            document.getElementById("panelTicket").style.display = "none";
            document.getElementById("cantidadTickets").value = 1;
        }

        function confirmarReserva() {
            const horario = document.getElementById("horarioPeli").value;
            const cantidad = document.getElementById("cantidadTickets").value;
            
            if(cantidad < 1 || cantidad > 5) {
                alert("⚠ Oye, la cantidad de tickets no es válida (min 1, max 5).");
                return;
            }

            alert(`🔥 ¡RESERVA LISTA! 🔥\n\nPelícula: ${peliElegida}\nHora: ${horario}\nEntradas: ${cantidad}\n\nPresenta este mensaje en taquilla.`);
            
            cerrarRegistro();
        }
    </script>
</body>
</html>
